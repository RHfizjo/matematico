<!doctype html>
<html lang="pl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <title>Matematico — sterowanie i platforma (dev)</title>
    <style>
      /* Udawana scena: łąka widziana z góry pod kątem (jak stała kamera gry). */
      #scene {
        position: fixed; inset: 0; overflow: hidden;
        background:
          linear-gradient(180deg, #86cfff 0%, #b7e4ff 16%, #d8f1ff 22%, #8ad96f 22.2%, #6cc35a 60%, #58ad48 100%);
      }
      .tile-grid {
        position: absolute; left: 0; right: 0; top: 22%; bottom: 0;
        background-image:
          linear-gradient(rgba(31, 42, 68, 0.06) 2px, transparent 2px),
          linear-gradient(90deg, rgba(31, 42, 68, 0.06) 2px, transparent 2px);
        background-size: 64px 48px;
      }
      .pond { position: absolute; left: 58%; top: 34%; width: 260px; height: 120px; background: #5ec3ff; border: 6px solid #3a9fd8; border-radius: 18px; box-shadow: inset 0 -12px 0 rgba(0,0,0,.08); }
      .path { position: absolute; left: 22%; top: 60%; width: 56%; height: 70px; background: #e9d49a; border-radius: 12px; opacity: .8; transform: skewX(-18deg); }
      .tree { position: absolute; width: 70px; height: 110px; transform: translate(-50%, -100%); }
      .tree::before { content: ''; position: absolute; left: 25px; bottom: 0; width: 20px; height: 40px; background: #8a5a3c; border: 4px solid #5d3a22; }
      .tree::after { content: ''; position: absolute; left: 0; top: 0; width: 70px; height: 74px; background: #3fae48; border: 4px solid #2a7a33; border-radius: 10px; box-shadow: inset -12px -10px 0 rgba(0,0,0,.12), inset 10px 10px 0 rgba(255,255,255,.12); }
      .actor { position: absolute; transform: translate(-50%, -100%); }
      .shadow { position: absolute; left: 50%; bottom: -10px; width: 130%; height: 22px; margin-left: -65%; border-radius: 50%; background: rgba(20, 40, 20, 0.22); }
      #hero .b { position: relative; width: 58px; height: 96px; background: linear-gradient(#f7cda6 0 34%, #3fa7ff 34% 70%, #3d5fa8 70%); border: 5px solid #1f2a44; border-radius: 10px; }
      #plusik .b { position: relative; width: 70px; height: 56px; background: #5fd35f; border: 5px solid #1f2a44; border-radius: 10px; }
      #plusik .b::before, #plusik .b::after { content: '+'; position: absolute; top: -46px; font: 900 44px/1 'Nunito', sans-serif; color: #a4f06f; -webkit-text-stroke: 3px #1f2a44; }
      #plusik .b::before { left: 0; } #plusik .b::after { right: 0; }
      #plusik .eyes { position: absolute; left: 14px; top: 14px; width: 32px; height: 12px; border-left: 9px solid #1f2a44; border-right: 9px solid #1f2a44; }
      .range-ring { position: absolute; width: 240px; height: 110px; border-radius: 50%; border: 5px dashed rgba(255, 255, 255, 0.75); transform: translate(-50%, -50%); }

      /* Panel deweloperski (prawa górna część ekranu — z dala od sterowania) */
      #dev {
        position: fixed; top: 16px; right: 16px; width: 430px; z-index: 100; font: 700 13px/1.3 system-ui, sans-serif; color: #1f2a44;
        background: rgba(255, 255, 255, 0.86); border: 2px solid rgba(31, 42, 68, 0.35); border-radius: 14px; padding: 10px 12px;
      }
      #dev h3 { margin: 6px 0 4px; font: 900 12px/1 system-ui; text-transform: uppercase; letter-spacing: .06em; color: #4a5775; }
      #dev .row { display: flex; flex-wrap: wrap; gap: 4px; }
      #dev button { font: 700 12px system-ui; padding: 4px 7px; border: 2px solid #1f2a44; border-radius: 8px; background: #fffaf0; cursor: pointer; }
      #dev button.on { background: #3fa7ff; color: #fff; }
      #dev .readout { display: grid; grid-template-columns: 96px 1fr; gap: 8px; align-items: center; }
      #dev canvas { background: #eef6ff; border-radius: 10px; border: 2px solid rgba(31,42,68,.25); }
      #dev .log { font: 600 12px/1.35 ui-monospace, monospace; white-space: pre-wrap; overflow-wrap: anywhere; min-height: 60px; }
      #dev .emoji-strip svg { width: 30px; height: 30px; display: block; }
      #dev .vec { font: 800 15px/1.2 ui-monospace, monospace; }
      #dev .emoji-strip { font: 400 24px/1.2 'Noto Color Emoji', sans-serif; display: flex; gap: 4px; flex-wrap: wrap; }
      #dev .emoji-strip span { display: inline-flex; flex-direction: column; align-items: center; font-size: 26px; }
      #dev .emoji-strip small { font: 700 9px system-ui; color: #4a5775; }
      #dev.collapsed .more { display: none; }

      /* Laboratorium dźwięku (stan 'audio-lab'): fale efektów renderowanych offline */
      #lab { position: fixed; inset: 0; z-index: 200; background: #fffaf0; padding: 20px 24px; overflow: auto; display: none; font: 700 13px system-ui; color: #1f2a44; }
      #lab.show { display: block; }
      #lab h2 { margin: 0 0 10px; font: 900 22px 'Nunito', system-ui; }
      #lab .grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
      #lab .cell { background: #fff; border: 2px solid #e7d7b0; border-radius: 12px; padding: 8px; }
      #lab .cell b { font: 900 15px 'Nunito', system-ui; }
      #lab .cell .m { font: 600 11px ui-monospace, monospace; color: #4a5775; }
      #lab .cell.bad { border-color: #ff6b6b; background: #fff0f0; }
      #lab canvas { width: 100%; height: 54px; display: block; margin-top: 4px; }
    </style>
  </head>
  <body>
    <div id="scene">
      <div class="tile-grid"></div>
      <div class="path"></div>
      <div class="pond"></div>
      <div class="tree" style="left: 12%; top: 38%"></div>
      <div class="tree" style="left: 30%; top: 33%"></div>
      <div class="tree" style="left: 50%; top: 30%"></div>
      <div class="tree" style="left: 86%; top: 36%"></div>
      <div class="tree" style="left: 8%; top: 84%"></div>
      <div class="range-ring" id="ring" style="left: 63%; top: 66%"></div>
      <div class="actor" id="plusik" style="left: 63%; top: 66%"><div class="shadow"></div><div class="b"><div class="eyes"></div></div></div>
      <div class="actor" id="hero" style="left: 52%; top: 64%"><div class="shadow"></div><div class="b"></div></div>
    </div>
    <div id="ui"></div>
    <div id="dev"></div>
    <div id="lab"></div>
    <script type="module" src="./input.ts"></script>
  </body>
</html>
