<!doctype html>
<html lang="pl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
    <title>Matematico — galeria modeli (dev)</title>
    <style>
      html, body { margin: 0; height: 100%; overflow: hidden; background: #9fd8ff; font-family: Nunito, system-ui, sans-serif; }
      #c { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
      #labels { position: fixed; inset: 0; pointer-events: none; }
      .lbl {
        position: absolute; transform: translate(-50%, -100%); white-space: nowrap; text-align: center;
        font: 800 13px/1.1 Nunito, system-ui, sans-serif; color: #1f2a44;
        background: rgba(255, 250, 240, 0.9); border: 2px solid #1f2a44; border-radius: 10px; padding: 3px 8px;
        box-shadow: 0 2px 0 rgba(31, 42, 68, 0.25);
      }
      .lbl small { display: block; font-weight: 700; font-size: 10px; color: #4a5775; }
      .lbl.rot { background: #eaffc2; }
      .lbl.glam { background: #ffe3f5; }
      .lbl.prop { background: #fff3d6; }
      #hud {
        position: fixed; left: 16px; bottom: 12px; font: 800 15px/1.2 Nunito, system-ui, sans-serif; color: #1f2a44;
        background: rgba(255, 250, 240, 0.85); border: 2px solid #1f2a44; border-radius: 12px; padding: 6px 12px;
      }
      #hud small { font-weight: 700; color: #4a5775; }
      #bar { position: fixed; right: 12px; bottom: 12px; display: flex; gap: 6px; flex-wrap: wrap; max-width: 60vw; justify-content: flex-end; }
      #bar button {
        font: 800 13px Nunito, system-ui, sans-serif; border: 2px solid #1f2a44; border-radius: 10px; background: #fffaf0;
        padding: 6px 10px; cursor: pointer; box-shadow: 0 2px 0 rgba(31, 42, 68, 0.25);
      }
      #bar button:active { transform: translateY(2px); box-shadow: none; }
    </style>
  </head>
  <body>
    <canvas id="c"></canvas>
    <div id="labels"></div>
    <div id="hud"></div>
    <div id="bar"></div>
    <script type="module" src="./models.ts"></script>
  </body>
</html>
