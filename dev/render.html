<!doctype html>
<html lang="pl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
    <title>Matematico — render (dev)</title>
    <style>
      html, body { margin: 0; height: 100%; overflow: hidden; background: #9fd8ff; font-family: system-ui, sans-serif; }
      #game { position: fixed; inset: 0; }
      #hud { position: fixed; top: 10px; right: 10px; display: flex; flex-direction: column; gap: 6px; align-items: flex-end; z-index: 5; }
      #hud .row { display: flex; gap: 4px; flex-wrap: wrap; justify-content: flex-end; }
      #hud button { font: 700 12px system-ui; padding: 5px 8px; border-radius: 8px; border: 2px solid #1f2a44; background: #fffaf0; color: #1f2a44; cursor: pointer; }
      #hud button.on { background: #3fa7ff; color: #fff; }
      #stats { font: 700 12px ui-monospace, monospace; background: rgba(31, 42, 68, 0.72); color: #fff; padding: 6px 8px; border-radius: 8px; white-space: pre; }
      #hud.hidden { display: none; }
      #portraits { position: fixed; left: 50%; top: 50%; transform: translate(-50%, -50%); display: none; grid-template-columns: repeat(6, 150px); gap: 10px;
        background: rgba(255, 250, 240, 0.92); padding: 16px; border-radius: 20px; border: 3px solid #1f2a44; z-index: 6; }
      #portraits figure { margin: 0; text-align: center; font: 700 11px system-ui; color: #1f2a44; }
      #portraits img { width: 150px; height: 150px; display: block; background: radial-gradient(circle at 50% 40%, #fff3d6, #ffd9a8); border-radius: 14px; }
    </style>
  </head>
  <body>
    <div id="game"></div>
    <div id="hud"></div>
    <div id="portraits"></div>
    <script type="module" src="./render.ts"></script>
  </body>
</html>
